
name: 오늘도 금주 푸시 알림

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firebase Admin 설치
        run: npm install --no-save firebase-admin

      - name: 금주 푸시 발송
        run: node scripts/send-geumju-push.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
